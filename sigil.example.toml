# Sigil Configuration
#
# Copy this to sigil.toml and edit to your needs.
# Or run: npm run onboard (sigil onboard)

version = "2.0.0"

# ── Identity ─────────────────────────────────────────────────────────
[identity]
name = "Sigil"
personality = "A helpful, direct personal AI agent. Concise but thorough."

# ── Model Pool ───────────────────────────────────────────────────────
# Configure one or more models. The first model (or default_model) is used.
# provider = "anthropic" or "openai-compatible"
# tier = "minimal" | "basic" | "standard" | "full"

# Example: Anthropic Claude
[[models]]
name = "claude"
provider = "anthropic"
model = "claude-sonnet-4-20250514"
tier = "standard"
api_key_env = "ANTHROPIC_API_KEY"
cost_per_1k_input = 0.003
cost_per_1k_output = 0.015
use_for = ["general"]

# Example: Local Ollama (uncomment to use)
# [[models]]
# name = "local"
# provider = "openai-compatible"
# base_url = "http://localhost:11434"
# model = "qwen3:8b"
# tier = "basic"
# cost_per_1k_input = 0
# cost_per_1k_output = 0
# use_for = ["chat"]

# Which model to use by default (must match a [[models]] name)
default_model = "claude"

# ── Memory ───────────────────────────────────────────────────────────
[memory]
db_path = "data/sigil.db"
max_recall_results = 5

# Vector embeddings (optional — enhances memory recall with semantic search)
# Without this, memory uses keyword search (FTS5) which works well on its own.
# embedding_model = "nomic-embed-text"                # Ollama
# embedding_model = "text-embedding-3-small"          # OpenAI
# embedding_provider = "http://localhost:11434"        # base URL for embedding API

# ── Transports ───────────────────────────────────────────────────────
[transports.tui]
enabled = true

[transports.web]
enabled = true
port = 3033
host = "127.0.0.1"

[transports.telegram]
enabled = false
# bot_token_env = "TELEGRAM_BOT_TOKEN"    # env var containing bot token
# allowed_chat_ids = ["123456789"]         # restrict to these chat IDs

# ── Skills ──────────────────────────────────────────────────────────
# Skills are markdown files in the skills/ directory that provide
# domain knowledge to the agent when relevant to a message.
# By default all skills are loaded. Uncomment 'enabled' to restrict.
# [skills]
# path = "skills"
# enabled = ["sigil-help"]
